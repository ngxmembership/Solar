name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Форум «Круг Солара»: пересобираем список бесед, когда в Discussions что-то меняется
  discussion:
    types: [created, edited, deleted, transferred, category_changed, pinned, unpinned, locked, unlocked, answered, unanswered]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  discussions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Беседы форума → forum.json
        run: node scripts/fetch-forum.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
